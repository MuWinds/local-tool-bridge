<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Local Tool Bridge</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <h1>Local Tool Bridge</h1>
      <span id="status-dot" class="dot" data-state="unknown" title="未连接"></span>
    </header>

    <p id="status-text" class="status">正在检查连接…</p>

    <section class="section">
      <label class="switch">
        <input id="enabled" type="checkbox" />
        <span>启用本地工具</span>
      </label>
      <p class="hint">关闭后网页端完全不受影响，不会注入任何内容。</p>
    </section>

    <section class="section">
      <h2>连接方式</h2>
      <div class="radios">
        <label class="radio">
          <input type="radio" name="transport" value="http" />
          <span>
            <strong>本地 HTTP（推荐）</strong>
            <em>扩展后台直接请求 127.0.0.1。Chrome 对扩展豁免本地网络限制，且后台可休眠。</em>
          </span>
        </label>
        <label class="radio">
          <input type="radio" name="transport" value="native" />
          <span>
            <strong>Native Messaging</strong>
            <em>由 Chrome 启动本地程序，只有本扩展能调用。需要注册宿主清单。</em>
          </span>
        </label>
        <label class="radio">
          <input type="radio" name="transport" value="websocket" />
          <span>
            <strong>本地 WebSocket</strong>
            <em>仅在需要服务端主动推送时使用；长连接会让后台常驻。</em>
          </span>
        </label>
      </div>
    </section>

    <section id="ws-settings" class="section" hidden>
      <h2>本地连接设置</h2>
      <div class="field">
        <label for="port">端口</label>
        <input id="port" type="number" min="1" max="65535" placeholder="8788" />
      </div>
      <div class="field">
        <label for="secret">令牌</label>
        <input id="secret" type="password" placeholder="从桥接程序窗口复制" />
      </div>
      <p class="hint">Native Messaging 不需要端口和令牌。</p>
    </section>

    <section class="section">
      <h2>工具</h2>
      <p class="hint">取消勾选即可禁止模型调用该工具。</p>
      <ul id="tools" class="tools">
        <li class="placeholder">连接后显示可用工具…</li>
      </ul>
    </section>

    <section class="section">
      <h2>注入语言</h2>
      <div class="radios inline">
        <label class="radio">
          <input type="radio" name="locale" value="zh" />
          <span><strong>中文</strong></span>
        </label>
        <label class="radio">
          <input type="radio" name="locale" value="en" />
          <span><strong>English</strong></span>
        </label>
      </div>
    </section>

    <footer class="footer">
      <button id="reconnect" type="button">重新连接</button>
      <span id="version" class="version"></span>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
