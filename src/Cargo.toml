[workspace]
members = ["crates/core", "crates/gui", "crates/host"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/example/local-tool-bridge"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
directories = "6"
dunce = "1"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_extras = { version = "0.29", features = ["datepicker"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
globset = "0.4"
ltb-core = { path = "crates/core" }
open = "5"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
single-instance = "0.3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "time", "net", "process", "fs", "signal"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tray-icon = "0.19"
url = "2"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
