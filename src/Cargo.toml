[workspace]
resolver = "2"
members = ["crates/core", "crates/host", "crates/gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "MIT"
repository = "https://github.com/example/local-tool-bridge"

[workspace.dependencies]
ltb-core = { path = "crates/core" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "time", "net", "process", "fs", "signal"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
regex = "1"
globset = "0.4"
walkdir = "2"
dunce = "1"
directories = "6"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
rand = "0.8"
base64 = "0.22"
url = "2"

# GUI-only
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_extras = { version = "0.29", features = ["datepicker"] }
tray-icon = "0.19"
single-instance = "0.3"
open = "5"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
